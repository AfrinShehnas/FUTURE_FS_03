<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link rel="stylesheet" href="style.css">
</head>

<script>

if(
localStorage.getItem("admin")
!== "true"
){
window.location.href =
"login.html";
}

</script>

<body onload="loadProducts();loadOrders();loadFeedbacks()">

<div class="navbar">

<div class="logo">
⚙️ Admin Dashboard
</div>

<div>

<button onclick="logout()">
Logout
</button>

</div>

</div>

<!-- ADD PRODUCT -->

<div class="admin-section">

<h2>Add Product</h2>

<input
type="text"
id="pname"
placeholder="Product Name"
>

<input
type="number"
id="pprice"
placeholder="Price"
>

<input
type="text"
id="pimage"
placeholder="images/apple.jpg"
>

<input
type="text"
id="pcategory"
placeholder="fruits / vegetables / grains"
>

<button onclick="addProduct()">
Add Product
</button>

</div>

<!-- PRODUCTS -->

<div class="admin-section">

<h2>Manage Products</h2>

<div id="products"></div>

</div>

<!-- ORDERS -->

<div class="admin-section">

<h2>Orders</h2>

<div id="orders"></div>

</div>

<!-- FEEDBACKS -->

<div class="admin-section">

<h2>Feedbacks</h2>

<div id="feedbacks"></div>

</div>

<script src="admin.js"></script>

</body>
</html>
